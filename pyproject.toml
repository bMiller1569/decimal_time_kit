[project]
name = "decimal-time-kit"
version = "0.1.1"
description = "Translates between 24-hour time and French decimal time, which uses 10 hours per day."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
